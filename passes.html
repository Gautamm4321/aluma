<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aluma Salon | Unlimited Yearly Passes</title>
  <meta name="description" content="Unlimited salon grooming passes for Men and Women at Aluma Salon. Elite, Classic, and Royal tiers.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,600;1,300&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --ink: #080808;
      --ivory: #F4F1EA;
      --champagne: #CBB892;
      --bg: #080808;
      --fg-rgb: 244, 241, 234;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: var(--bg);
      color: rgb(var(--fg-rgb));
      font-family: 'Jost', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      min-height: 100vh;
    }

    .font-serif-title { font-family: 'Playfair Display', Georgia, serif; }

    /* Atmosphere Lighting from index.html */
    #atmo {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: 
        radial-gradient(85% 70% at 50% 30%, rgba(191, 196, 199, 0.08) 0%, rgba(191, 196, 199, 0) 70%),
        radial-gradient(150% 125% at 50% 45%, rgba(0, 0, 0, 0) 52%, rgba(0, 0, 0, 0.7) 100%);
    }

    /* Glass Card 3D Styling */
    .pass-card-wrap {
      perspective: 1200px;
    }

    .pass-card {
      position: relative;
      border-radius: 28px;
      overflow: hidden;
      transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.4s ease;
      background: rgba(18, 18, 18, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .pass-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.8);
      border-color: rgba(203, 184, 146, 0.35);
    }

    /* Physical 3D Membership Pass Simulation */
    .sim-card {
      width: 175px;
      height: 275px;
      border-radius: 20px;
      position: relative;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 20px 40px -10px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.4);
      transform: rotate(-4deg);
      transition: transform 0.4s ease;
    }

    .pass-card:hover .sim-card {
      transform: rotate(0deg) scale(1.04);
    }

    /* Card Themes */
    .sim-elite {
      background: linear-gradient(135deg, rgba(255,255,255,0.22) 0%, rgba(150,150,150,0.08) 50%, rgba(20,20,20,0.4) 100%);
      border: 1.5px solid rgba(255,255,255,0.35);
    }
    .sim-classic {
      background: linear-gradient(135deg, rgba(235, 75, 45, 0.45) 0%, rgba(180, 40, 20, 0.2) 50%, rgba(15, 10, 10, 0.6) 100%);
      border: 1.5px solid rgba(255, 120, 95, 0.45);
    }
    .sim-royal {
      background: linear-gradient(135deg, rgba(215, 175, 95, 0.5) 0%, rgba(170, 125, 45, 0.25) 50%, rgba(20, 15, 5, 0.65) 100%);
      border: 1.5px solid rgba(245, 215, 145, 0.5);
    }

    .sim-card::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 20px;
      background: linear-gradient(125deg, rgba(255,255,255,0.35) 0%, transparent 45%);
      pointer-events: none;
    }
  </style>
</head>
<body class="relative flex flex-col justify-between">

  <div id="atmo" aria-hidden="true"></div>

  <!-- Top Navigation Bar -->
  <header class="relative z-30 px-5 md:px-10 pt-6 pb-4 flex items-center justify-between">
    <a href="index.html" class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-[#121212]/80 hover:bg-[#1c1c1e] border border-white/10 text-xs md:text-sm text-[#F4F1EA] hover:text-[#CBB892] transition backdrop-blur-md shadow">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
      <span>Back</span>
    </a>

    <!-- Mens / Womens Toggle Pill -->
    <div class="bg-[#121212]/90 backdrop-blur-md border border-[#CBB892]/30 p-1 rounded-full flex items-center shadow-xl">
      <button 
        id="tabMens" 
        onclick="switchPassCategory('mens')" 
        class="px-5 py-1.5 rounded-full text-xs md:text-sm font-medium transition-all duration-300 text-[#F4F1EA]/70 hover:text-white"
      >
        Mens
      </button>
      <button 
        id="tabWomens" 
        onclick="switchPassCategory('womens')" 
        class="px-5 py-1.5 rounded-full text-xs md:text-sm font-medium transition-all duration-300 bg-[#CBB892] text-[#080808] shadow-sm font-semibold"
      >
        Womens
      </button>
    </div>

    <a href="index.html#book" class="hidden sm:inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-[#CBB892] text-[#080808] hover:bg-[#DFCEAC] text-xs md:text-sm font-medium transition shadow">
      Book Visit
    </a>
  </header>

  <!-- Main Content -->
  <main class="relative z-20 max-w-7xl mx-auto w-full px-5 md:px-10 py-6 md:py-10 flex-1 flex flex-col justify-center">
    
    <div class="text-center mb-10 md:mb-14">
      <p class="text-[11px] md:text-xs uppercase tracking-[0.28em] text-[#CBB892] font-semibold mb-2">Exclusive Annual Membership</p>
      <h1 class="text-3xl md:text-5xl font-serif-title tracking-tight text-[#F4F1EA]">Unlimited Grooming Passes</h1>
      <p class="text-xs md:text-sm text-white/50 tracking-wider mt-2 font-light max-w-md mx-auto">Pay once a year, enjoy unlimited visits with certified stylists across Bengaluru salons.</p>
    </div>

    <!-- Passes Grid (Elite, Classic, Royal) -->
    <div id="passesContainer" class="grid grid-cols-1 md:grid-cols-3 gap-6 lg:gap-8 items-stretch">
      <!-- Dynamic cards injected by JS -->
    </div>

  </main>

  <footer class="relative z-20 text-center py-6 border-t border-white/5 text-[11px] text-white/35">
    © 2026 Aluma Salon • Bengaluru • Verified Stylists & Zero Waiting
  </footer>

  <script>
    const PASS_DATA = {
      womens: [
        {
          id: 'elite',
          name: 'Elite',
          icon: '✨',
          cardClass: 'sim-elite',
          bgGlow: 'radial-gradient(circle at 85% 15%, rgba(255,255,255,0.08) 0%, transparent 60%)',
          price: '7,999',
          originalPrice: '32,000',
          unlimited: [
            'Threading',
            'Full Arms Wax',
            'Full Legs Wax',
            'Underarms Wax'
          ]
        },
        {
          id: 'classic',
          name: 'Classic',
          icon: '⦿',
          cardClass: 'sim-classic',
          bgGlow: 'radial-gradient(circle at 85% 15%, rgba(235,75,45,0.12) 0%, transparent 60%)',
          price: '15,999',
          originalPrice: '42,000',
          unlimited: [
            'Threading',
            'Full Arms Wax',
            'Full Legs Wax',
            'Underarms Wax',
            'D-tan or Clean Up'
          ]
        },
        {
          id: 'royal',
          name: 'Royal',
          icon: '👑',
          cardClass: 'sim-royal',
          bgGlow: 'radial-gradient(circle at 85% 15%, rgba(215,175,95,0.16) 0%, transparent 60%)',
          price: '20,999',
          originalPrice: '65,000',
          unlimited: [
            'Threading',
            'Full Arms Wax',
            'Full Legs Wax',
            'Underarms Wax',
            'D-tan or Clean Up',
            'Pedicure & Manicure'
          ]
        }
      ],
      mens: [
        {
          id: 'elite',
          name: 'Elite',
          icon: '✨',
          cardClass: 'sim-elite',
          bgGlow: 'radial-gradient(circle at 85% 15%, rgba(255,255,255,0.08) 0%, transparent 60%)',
          price: '6,999',
          originalPrice: '30,000',
          unlimited: [
            'Hair Cut',
            'Beard & Shave',
            'Head Massage'
          ]
        },
        {
          id: 'classic',
          name: 'Classic',
          icon: '⦿',
          cardClass: 'sim-classic',
          bgGlow: 'radial-gradient(circle at 85% 15%, rgba(235,75,45,0.12) 0%, transparent 60%)',
          price: '14,999',
          originalPrice: '40,000',
          unlimited: [
            'Hair Cut',
            'Beard & Shave',
            'Head Massage',
            'D-tan or Clean Up'
          ]
        },
        {
          id: 'royal',
          name: 'Royal',
          icon: '👑',
          cardClass: 'sim-royal',
          bgGlow: 'radial-gradient(circle at 85% 15%, rgba(215,175,95,0.16) 0%, transparent 60%)',
          price: '19,999',
          originalPrice: '60,000',
          unlimited: [
            'Hair Cut',
            'Beard & Shave',
            'Head Massage',
            'D-tan or Clean Up',
            'Pedicure & Manicure'
          ]
        }
      ]
    };

    let activeCategory = 'womens';

    function renderCards() {
      const container = document.getElementById('passesContainer');
      const list = PASS_DATA[activeCategory];

      container.innerHTML = list.map(item => `
        <div class="pass-card p-6 md:p-7 flex flex-col justify-between" style="background-image: ${item.bgGlow}">
          
          <!-- Top Row: Card Visual & Title -->
          <div class="flex items-start justify-between gap-4 mb-6">
            
            <div class="sim-card ${item.cardClass} flex-shrink-0">
              <div class="flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-white/70"></span>
                <span class="text-[9px] tracking-[0.2em] font-medium uppercase text-white/90">ALUMA</span>
              </div>
              <div class="text-right">
                <span class="text-xs text-white/70 block leading-none mb-1">${item.icon}</span>
                <span class="text-xs font-semibold tracking-wider text-white uppercase">${item.name}</span>
              </div>
            </div>

            <div class="flex-1 pl-2">
              <div class="flex items-center gap-1.5 text-[#CBB892] text-sm font-semibold mb-2">
                <span>${item.icon}</span>
                <h3 class="text-xl md:text-2xl font-serif-title font-semibold text-[#F4F1EA]">${item.name}</h3>
              </div>
              
              <p class="text-[11px] uppercase tracking-wider text-white/40 font-semibold mb-2">Unlimited:</p>
              <ul class="space-y-1.5">
                ${item.unlimited.map(feat => `
                  <li class="flex items-center gap-2 text-xs text-white/80">
                    <span class="w-1.5 h-1.5 rounded-full bg-[#CBB892]"></span>
                    <span>${feat}</span>
                  </li>
                `).join('')}
              </ul>
            </div>

          </div>

          <!-- Bottom: Pricing & CTA -->
          <div class="pt-5 border-t border-white/10 mt-auto">
            <div class="mb-4">
              <span class="text-xs text-white/40 line-through">₹${item.originalPrice}</span>
              <div class="flex items-baseline gap-1 mt-0.5">
                <span class="text-2xl md:text-3xl font-semibold text-[#CBB892]">₹${item.price}</span>
                <span class="text-xs text-white/50 font-light">/ year</span>
              </div>
            </div>

            <a 
              href="index.html#book" 
              class="w-full py-3 rounded-xl bg-white hover:bg-[#F4F1EA] text-[#080808] font-semibold text-xs tracking-wider uppercase transition shadow flex items-center justify-center gap-2 group"
            >
              <span>BUY NOW</span>
              <span class="group-hover:translate-x-0.5 transition-transform">→</span>
            </a>
          </div>

        </div>
      `).join('');
    }

    function switchPassCategory(cat) {
      if (activeCategory === cat) return;
      activeCategory = cat;

      const btnM = document.getElementById('tabMens');
      const btnW = document.getElementById('tabWomens');

      const on = 'px-5 py-1.5 rounded-full text-xs md:text-sm font-semibold transition-all duration-300 bg-[#CBB892] text-[#080808] shadow-sm';
      const off = 'px-5 py-1.5 rounded-full text-xs md:text-sm font-medium transition-all duration-300 text-[#F4F1EA]/70 hover:text-white';

      btnM.className = cat === 'mens' ? on : off;
      btnW.className = cat === 'womens' ? on : off;

      renderCards();
    }

    document.addEventListener('DOMContentLoaded', renderCards);
  </script>
</body>
</html>
