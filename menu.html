  <style>
    :root {
      --ink: #080808;
      --ivory: #F4F1EA;
      --sage: #C9D8C5;
      --mint: #DCE8DF;
      --sand: #D8C8B5;
      --nude: #E6D5CA;
      --blush: #E8D6D1;
      --olive: #AEB9A5;
      --champagne: #CBB892;
      --chrome: #BFC4C7;
      --bg: #080808;
      --fg-rgb: 244, 241, 234;
      --bgc: #080808;
      --pad: clamp(20px, 4vw, 60px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: var(--bg);
      color: rgb(var(--fg-rgb));
      font-family: 'Jost', ui-sans-serif, system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
      overflow-y: hidden; /* App view with wheel driven flipbook */
      -webkit-font-smoothing: antialiased;
      user-select: none;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .font-serif-title { font-family: 'Playfair Display', Georgia, serif; }

    /* Atmosphere Lighting from index.html */
    #atmo {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      --glow: 191, 196, 199;
      --ga: 0.08;
      --va: 0.6;
      background: 
        radial-gradient(85% 70% at 58% 40%, rgba(var(--glow), var(--ga)) 0%, rgba(var(--glow), 0) 70%),
        radial-gradient(150% 125% at 50% 45%, rgba(0, 0, 0, 0) 52%, rgba(0, 0, 0, var(--va)) 100%);
    }

    .book-viewport {
      perspective: 2600px;
      perspective-origin: 50% 50%;
      position: relative;
      z-index: 10;
    }

    .book-container {
      position: relative;
      width: 100%;
      max-width: 980px;
      height: min(84vh, 660px);
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* Hardcover Spine Depth Shadow */
    .book-container::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 52px;
      transform: translateX(-50%);
      background: linear-gradient(90deg, 
        rgba(0,0,0,0.3) 0%, 
        rgba(0,0,0,0.12) 30%, 
        rgba(255,255,255,0.06) 50%, 
        rgba(0,0,0,0.12) 70%, 
        rgba(0,0,0,0.3) 100%
      );
      pointer-events: none;
      z-index: 50;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
    }

    /* Flip Leaf Definition */
    .flip-leaf {
      position: absolute;
      top: 0;
      right: 0;
      width: 50%;
      height: 100%;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 0.9s cubic-bezier(0.645, 0.045, 0.355, 1.0);
      cursor: pointer;
    }

    .flip-leaf.flipped {
      transform: rotateY(-180deg);
    }

    .leaf-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      overflow: hidden;
      background: var(--ivory);
      color: var(--ink);
      box-shadow: 
        inset 0 0 45px rgba(0, 0, 0, 0.04), 
        0 12px 35px -8px rgba(0, 0, 0, 0.6);
    }

    .leaf-face.front {
      border-radius: 0 16px 16px 0;
      border-left: 1px solid rgba(8, 8, 8, 0.12);
      transform: rotateY(0deg);
    }

    .leaf-face.back {
      border-radius: 16px 0 0 16px;
      border-right: 1px solid rgba(8, 8, 8, 0.12);
      transform: rotateY(180deg);
    }

    /* Inner Gutter Gradients */
    .inner-gutter-right {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(to right, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.03) 6%, transparent 18%);
    }

    .inner-gutter-left {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(to left, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.03) 6%, transparent 18%);
    }

    /* Luxury Editorial Paper Background */
    .paper-look {
      background-color: var(--ivory);
      background-image: 
        radial-gradient(circle at 85% 15%, rgba(203,184,146,0.16) 0%, transparent 60%),
        radial-gradient(circle at 10% 90%, rgba(216,200,181,0.2) 0%, transparent 55%),
        linear-gradient(to bottom, rgba(255,255,255,0.4), rgba(244,241,234,0.95));
    }

    /* Cover Page Texture */
    .paper-cover-light {
      background-color: #ECE7DC;
      background-image: 
        radial-gradient(circle at 50% 45%, rgba(203,184,146,0.25) 0%, transparent 70%),
        radial-gradient(circle at 15% 20%, rgba(191,196,199,0.18) 0%, transparent 40%);
    }

    /* Paper curl cue at edge */
    .edge-curl {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, transparent 50%, rgba(203,184,146,0.3) 50%, rgba(0,0,0,0.12) 100%);
      clip-path: polygon(100% 0, 0 100%, 100% 100%);
      transition: all 0.3s ease;
      pointer-events: none;
    }
    .flip-leaf:hover .edge-curl {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, transparent 50%, #CBB892 50%, rgba(0,0,0,0.22) 100%);
    }

    /* Custom Minimal Scrollbar for item lists */
    .page-scroll::-webkit-scrollbar { width: 4px; }
    .page-scroll::-webkit-scrollbar-thumb { background: rgba(203,184,146,0.4); border-radius: 4px; }
    .page-scroll::-webkit-scrollbar-track { background: transparent; }

    /* Single page on Mobile Screens */
    @media (max-width: 768px) {
      .book-container::after { display: none; }
      .flip-leaf {
        width: 100%;
        right: 0;
        left: 0;
      }
      .flip-leaf.flipped {
        display: none;
      }
    }
  </style>
</head>

    let audioContext = null;
    let soundEnabled = true;

    function getAudioCtx() {
      if (!audioContext) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) audioContext = new AudioCtx();
      }
      if (audioContext && audioContext.state === 'suspended') {
        audioContext.resume();
      }
      return audioContext;
    }

    function playPageTurnAudio() {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;

        // White noise friction burst for crisp paper sound
        const duration = 0.16;
        const buffer = ctx.createBuffer(1, ctx.sampleRate * duration, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (data.length * 0.45));
        }

        const source = ctx.createBufferSource();
        source.buffer = buffer;

        // Bandpass filter to match tactile linen page friction
        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1250, now);
        filter.frequency.exponentialRampToValueAtTime(320, now + duration);
        filter.Q.setValueAtTime(2.2, now);

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.005, now);
        gain.gain.linearRampToValueAtTime(0.28, now + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        source.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        source.start(now);
        source.stop(now + duration);
      } catch (e) {
        // audio gracefully falls back if prevented
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;

    function buildFlipbook() {
      const bookEl = document.getElementById('book');
      const data = getCatalogData();
      totalSpreads = data.length;
      bookEl.innerHTML = '';

      data.forEach((spreadItem, idx) => {
        const leaf = document.createElement('div');
        leaf.className = 'flip-leaf';
        leaf.id = `leaf-${idx}`;
        leaf.style.zIndex = (totalSpreads - idx) * 4;

        // Spread Item used for front and back pages
        leaf.innerHTML = `
          <!-- Front Face of Leaf -->
          <div class="leaf-face front">
            ${renderFaceHTML(spreadItem, idx, true)}
            <div class="inner-gutter-right"></div>
          </div>
          <!-- Back Face of Leaf -->
          <div class="leaf-face back">
            ${renderFaceHTML(data[idx + 1] || null, idx + 1, false)}
            <div class="inner-gutter-left"></div>
          </div>
        `;

        // Direct edge click to flip
        leaf.addEventListener('click', (e) => {
          if (e.target.closest('button') || e.target.closest('a')) return;
          if (idx === currentSpread) {
            flipNext();
          } else if (idx === currentSpread - 1) {
            flipPrev();
          }
        });

        bookEl.appendChild(leaf);
      });

      renderNavigationTrack();
      updateSpreadState();
    }

    function updateSpreadState() {
      for (let i = 0; i < totalSpreads; i++) {
        const leaf = document.getElementById(`leaf-${i}`);
        if (!leaf) continue;

        if (i < currentSpread) {
          leaf.classList.add('flipped');
          leaf.style.zIndex = 10 + i; // Left stacked
        } else {
          leaf.classList.remove('flipped');
          leaf.style.zIndex = (totalSpreads - i) * 4; // Right stacked
        }
      }

      document.getElementById('btnPrev').disabled = currentSpread === 0;
      document.getElementById('btnNext').disabled = currentSpread >= totalSpreads;

      document.getElementById('pageIndicator').textContent = `${currentSpread + 1} / ${totalSpreads}`;
      updateNavigationDots();
    }

    function flipNext() {
      if (currentSpread < totalSpreads) {
        currentSpread++;
        playPageTurnAudio();
        updateSpreadState();
      }
    }

    function flipPrev() {
      if (currentSpread > 0) {
        currentSpread--;
        playPageTurnAudio();
        updateSpreadState();
      }
    }

    function jumpToSpread(targetIndex) {
      if (targetIndex >= 0 && targetIndex <= totalSpreads && targetIndex !== currentSpread) {
        currentSpread = targetIndex;
        playPageTurnAudio();
        updateSpreadState();
      }
    }

    function renderNavigationTrack() {
      const track = document.getElementById('dotTrack');
      track.innerHTML = '';
      for (let i = 0; i < totalSpreads; i++) {
        const dot = document.createElement('button');
        dot.className = `w-2 h-2 rounded-full transition-all ${i === currentSpread ? 'bg-[#CBB892] w-5' : 'bg-white/20 hover:bg-white/40'}`;
        dot.title = `Go to Spread ${i + 1}`;
        dot.onclick = () => jumpToSpread(i);
        track.appendChild(dot);
      }
    }

    function updateNavigationDots() {
      const dots = document.getElementById('dotTrack').children;
      for (let i = 0; i < dots.length; i++) {
        dots[i].className = `w-2 h-2 rounded-full transition-all ${i === currentSpread ? 'bg-[#CBB892] w-5' : 'bg-white/20 hover:bg-white/40'}`;
      }
    }

    function switchMenu(gender) {
      if (activeCatalog === gender) return;
      activeCatalog = gender;
      currentSpread = 0;

      const btnW = document.getElementById('btnWomen');
      const btnM = document.getElementById('btnMen');

      if (gender === 'women') {
        btnW.className = 'px-4 py-1.5 rounded-full text-xs md:text-sm font-medium transition-all duration-300 flex items-center gap-1.5 bg-[#CBB892] text-[#080808] shadow-sm';
        btnM.className = 'px-4 py-1.5 rounded-full text-xs md:text-sm font-medium transition-all duration-300 flex items-center gap-1.5 text-[#F4F1EA]/70 hover:text-white';
      } else {
        btnM.className = 'px-4 py-1.5 rounded-full text-xs md:text-sm font-medium transition-all duration-300 flex items-center gap-1.5 bg-[#CBB892] text-[#080808] shadow-sm';
        btnW.className = 'px-4 py-1.5 rounded-full text-xs md:text-sm font-medium transition-all duration-300 flex items-center gap-1.5 text-[#F4F1EA]/70 hover:text-white';
      }

      playPageTurnAudio();
      buildFlipbook();
    }

    let wheelCooldown = false;

    window.addEventListener('wheel', (e) => {
      // Prevent rapid continuous flipping on sensitive trackpads
      if (wheelCooldown) return;

      const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;

      if (delta > 35) { // Scrolled down / right -> Flip next
        flipNext();
        wheelCooldown = true;
        setTimeout(() => { wheelCooldown = false; }, 420);
      } else if (delta < -35) { // Scrolled up / left -> Flip previous
        flipPrev();
        wheelCooldown = true;
        setTimeout(() => { wheelCooldown = false; }, 420);
      }
    }, { passive: true });

    // Touch swipe handling
    let touchStartX = 0;
    let touchStartY = 0;

    window.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      const diffX = touchStartX - e.changedTouches[0].screenX;
      const diffY = touchStartY - e.changedTouches[0].screenY;

      // Ensure horizontal swipe intent
      if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 40) {
        if (diffX > 0) flipNext(); // Swiped left -> Next
        else flipPrev();          // Swiped right -> Previous
      }
    }, { passive: true });

    // Keyboard arrow keys
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'PageDown') flipNext();
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') flipPrev();
      if (e.key === 'Escape') closeBookModal();
    });

    // Quick Book Modal
    function openBookModal(title, price) {
      document.getElementById('modalServiceTitle').textContent = title;
      document.getElementById('modalServicePrice').textContent = price;
      document.getElementById('modalBookLink').href = `index.html#book`;
      document.getElementById('quickBookModal').classList.remove('hidden');
    }

    function closeBookModal() {
      document.getElementById('quickBookModal').classList.add('hidden');
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Check query parameter (?gender=men)
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('gender') === 'men') {
        activeCatalog = 'men';
        document.getElementById('btnMen').click();
      } else {
        buildFlipbook();
      }
    });
