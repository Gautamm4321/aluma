  <style>
    :root {
      --ink: #080808;
      --ivory: #F4F1EA;
      --sage: #C9D8C5;
      --mint: #DCE8DF;
      --sand: #D8C8B5;
      --nude: #E6D5CA;
      --blush: #E8D6D1;
      --olive: #AEB9A5;
      --champagne: #CBB892;
      --chrome: #BFC4C7;
      --bg: #080808;
      --fg-rgb: 244, 241, 234;
      --bgc: #080808;
      --pad: clamp(20px, 4vw, 60px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: var(--bg);
      color: rgb(var(--fg-rgb));
      font-family: 'Jost', ui-sans-serif, system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
      overflow-y: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .font-serif-title { font-family: 'Playfair Display', Georgia, serif; }

    /* Atmosphere Lighting from index.html */
    #atmo {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      --glow: 191, 196, 199;
      --ga: 0.08;
      --va: 0.6;
      background: 
        radial-gradient(85% 70% at 58% 40%, rgba(var(--glow), var(--ga)) 0%, rgba(var(--glow), 0) 70%),
        radial-gradient(150% 125% at 50% 45%, rgba(0, 0, 0, 0) 52%, rgba(0, 0, 0, var(--va)) 100%);
    }

    .book-viewport {
      perspective: 2600px;
      perspective-origin: 50% 50%;
      position: relative;
      z-index: 10;
    }

    .book-container {
      position: relative;
      width: 100%;
      max-width: 980px;
      height: min(calc(100dvh - 190px), 660px);
      min-height: 420px;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* Hardcover Spine Depth Shadow */
    .book-container::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 52px;
      transform: translateX(-50%);
      background: linear-gradient(90deg, 
        rgba(0,0,0,0.3) 0%, 
        rgba(0,0,0,0.12) 30%, 
        rgba(255,255,255,0.06) 50%, 
        rgba(0,0,0,0.12) 70%, 
        rgba(0,0,0,0.3) 100%
      );
      pointer-events: none;
      z-index: 50;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
    }

    /* Flip Leaf Definition */
    .flip-leaf {
      position: absolute;
      top: 0;
      right: 0;
      width: 50%;
      height: 100%;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 0.9s cubic-bezier(0.645, 0.045, 0.355, 1.0);
      cursor: pointer;
    }

    .flip-leaf.flipped {
      transform: rotateY(-180deg);
    }

    .leaf-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      overflow: hidden;
      background: var(--ivory);
      color: var(--ink);
      box-shadow: 
        inset 0 0 45px rgba(0, 0, 0, 0.04), 
        0 12px 35px -8px rgba(0, 0, 0, 0.6);
    }

    .leaf-face.front {
      border-radius: 0 16px 16px 0;
      border-left: 1px solid rgba(8, 8, 8, 0.12);
      transform: rotateY(0deg);
    }

    .leaf-face.back {
      border-radius: 16px 0 0 16px;
      border-right: 1px solid rgba(8, 8, 8, 0.12);
      transform: rotateY(180deg);
    }

    /* Inner Gutter Gradients */
    .inner-gutter-right {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(to right, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.03) 6%, transparent 18%);
    }

    .inner-gutter-left {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(to left, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.03) 6%, transparent 18%);
    }

    /* Luxury Editorial Paper Background */
    .paper-look {
      background-color: var(--ivory);
      background-image: 
        radial-gradient(circle at 85% 15%, rgba(203,184,146,0.16) 0%, transparent 60%),
        radial-gradient(circle at 10% 90%, rgba(216,200,181,0.2) 0%, transparent 55%),
        linear-gradient(to bottom, rgba(255,255,255,0.4), rgba(244,241,234,0.95));
    }

    /* Cover Page Texture */
    .paper-cover-light {
      background-color: #ECE7DC;
      background-image: 
        radial-gradient(circle at 50% 45%, rgba(203,184,146,0.25) 0%, transparent 70%),
        radial-gradient(circle at 15% 20%, rgba(191,196,199,0.18) 0%, transparent 40%);
    }

    /* Paper curl cue at edge */
    .edge-curl {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, transparent 50%, rgba(203,184,146,0.3) 50%, rgba(0,0,0,0.12) 100%);
      clip-path: polygon(100% 0, 0 100%, 100% 100%);
      transition: all 0.3s ease;
      pointer-events: none;
    }
    .flip-leaf:hover .edge-curl {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, transparent 50%, #CBB892 50%, rgba(0,0,0,0.22) 100%);
    }

    /* Custom Minimal Scrollbar for item lists */
    .page-scroll::-webkit-scrollbar { width: 4px; }
    .page-scroll::-webkit-scrollbar-thumb { background: rgba(203,184,146,0.4); border-radius: 4px; }
    .page-scroll::-webkit-scrollbar-track { background: transparent; }

        html { overflow: hidden; height: 100%; }
    .book-viewport { width: 100%; max-width: 1024px; }

    /* ---- Page content (no scrolling, JS splits content to fit) ---- */
    .pg { width:100%; height:100%; display:flex; flex-direction:column; padding:20px 22px 14px; color:var(--ink); overflow:hidden; }
    .pg-head { flex:none; display:flex; justify-content:space-between; align-items:flex-end; border-bottom:1px solid rgba(8,8,8,.1); padding-bottom:8px; margin-bottom:10px; }
    .pg-tag { font-size:10px; letter-spacing:.14em; text-transform:uppercase; font-weight:600; color:#8E7951; }
    .pg-title { font-family:'Playfair Display',Georgia,serif; font-size:17px; font-weight:600; line-height:1.2; }
    .pg-num { font:11px monospace; opacity:.4; }
    .pg-body { flex:1 1 auto; min-height:0; overflow:hidden; }
    .pg-foot { flex:none; display:flex; justify-content:space-between; border-top:1px solid rgba(8,8,8,.1); padding-top:6px; margin-top:8px; font-size:10px; opacity:.55; }
    .blk + .blk { margin-top:12px; }
    .blk h3 { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:#8E7951; border-bottom:1px solid rgba(8,8,8,.1); padding-bottom:3px; margin-bottom:5px; }
    .row { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:12px; line-height:1.3; padding:4px 6px; border-radius:4px; cursor:pointer; transition:background .2s; }
    .row:hover { background:rgba(0,0,0,.05); }
    .row .nm { font-weight:500; }
    .row .tg { font-size:9px; padding:1px 5px; border-radius:3px; background:rgba(203,184,146,.28); color:#5e4e31; margin-left:6px; white-space:nowrap; }
    .row .pr { font-weight:600; white-space:nowrap; }
    .tbl { width:100%; border-collapse:collapse; font-size:12px; }
    .tbl th { text-align:left; padding:5px 4px; font-size:10px; color:#5a4e37; border-bottom:1px solid rgba(8,8,8,.15); }
    .tbl td { padding:6px 4px; border-bottom:1px solid rgba(8,8,8,.05); }
    .tbl tbody tr { cursor:pointer; }
    .tbl tbody tr:hover { background:rgba(0,0,0,.05); }

    /* ---- Mobile: one page per screen, swipe + bottom buttons ---- */
    @media (max-width: 768px) {
      .book-container { height: calc(100dvh - 205px); max-height: 760px; min-height: 360px; }
      .book-container::after { display: none; }
      .flip-leaf { width: 100%; left: 0; right: 0; }
      .flip-leaf.flipped { transform: rotateY(-100deg); opacity: 0; pointer-events: none; transition: transform .6s ease, opacity .5s ease .1s; }
      .leaf-face.front { border-radius: 16px; border-left: 0; }
      .pg { padding: 18px 18px 12px; }
      .row { font-size: 13px; padding: 5px 6px; }
      .tbl { font-size: 12.5px; }
    }
    
  </style>
</head>

    let audioContext = null;
    let soundEnabled = true;

    function getAudioCtx() {
      if (!audioContext) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) audioContext = new AudioCtx();
      }
      if (audioContext && audioContext.state === 'suspended') {
        audioContext.resume();
      }
      return audioContext;
    }

    function playPageTurnAudio() {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;

        // White noise friction burst for crisp paper sound
        const duration = 0.16;
        const buffer = ctx.createBuffer(1, ctx.sampleRate * duration, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (data.length * 0.45));
        }

        const source = ctx.createBufferSource();
        source.buffer = buffer;

        // Bandpass filter to match tactile linen page friction
        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1250, now);
        filter.frequency.exponentialRampToValueAtTime(320, now + duration);
        filter.Q.setValueAtTime(2.2, now);

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.005, now);
        gain.gain.linearRampToValueAtTime(0.28, now + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        source.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        source.start(now);
        source.stop(now + duration);
      } catch (e) {
        // audio gracefully falls back if prevented
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('soundOnIcon').classList.toggle('hidden', !soundEnabled);
      document.getElementById('soundOffIcon').classList.toggle('hidden', soundEnabled);

    function faceHTML(page, idx) {
      if (!page) {
        return `<div class="w-full h-full paper-look flex items-center justify-center text-[#080808]/25 font-light tracking-widest text-xs uppercase">Aluma Salon • Bengaluru</div>`;
      }
      if (page.cover) return coverHTML(page.cover);
      const inner = page.blocks.map(b => b.kind === 'table' ? tableHTML(b.table) : listHTML(b)).join('');
      return shellHTML(page.meta, inner, idx);
    }

    /* ---------- Splits content into pages that fit the real page size ---------- */
    function paginate(data, w, h) {
      const probe = document.createElement('div');
      probe.style.cssText = `position:fixed;left:-9999px;top:0;width:${w}px;height:${h}px;visibility:hidden;pointer-events:none;`;
      document.body.appendChild(probe);
      const out = [];
      let cur = null, body = null;
      const open = meta => {
        probe.innerHTML = shellHTML(meta, '', '');
        body = probe.querySelector('.pg-body');
        cur = { meta, blocks: [] };
        out.push(cur);
      };
      const fits = () => body.scrollHeight <= body.clientHeight + 1;

      data.forEach(sp => {
        if (sp.type === 'cover') { out.push({ cover: sp }); return; }
        const meta = { category: sp.category, tag: sp.tag };
        const blocks = [];
        (sp.columns || []).forEach(c => blocks.push({ kind: 'list', title: c.title, items: c.items }));
        if (sp.table) blocks.push({ kind: 'table', table: sp.table });
        if (sp.table && sp.items) blocks.push({ kind: 'list', title: 'Signature Spa & Massages', items: sp.items });

        open(meta);
        blocks.forEach(b => {
          if (b.kind === 'table') {
            body.insertAdjacentHTML('beforeend', tableHTML(b.table));
            if (!fits() && cur.blocks.length) {
              open(meta);
              body.insertAdjacentHTML('beforeend', tableHTML(b.table));
            }
            cur.blocks.push(b);
            return;
          }
          let title = b.title;
          const items = b.items.slice();
          while (items.length) {
            body.insertAdjacentHTML('beforeend', listShell(title));
            const rows = body.lastElementChild.querySelector('.rows');
            const taken = [];
            while (items.length) {
              rows.insertAdjacentHTML('beforeend', itemHTML(items[0]));
              if (!fits()) { rows.lastElementChild.remove(); break; }
              taken.push(items.shift());
            }
            if (!taken.length && !cur.blocks.length) taken.push(items.shift());
            if (taken.length) cur.blocks.push({ kind: 'list', title, items: taken });
            if (items.length) {
              open(meta);
              title = taken.length ? b.title + ' (cont.)' : b.title;
            }
          }
        });
      });
      probe.remove();
      return out;
    }

    /* ---------- Book engine ---------- */
    function buildFlipbook() {
      const bookEl = document.getElementById('book');
      isMobile = mqMobile.matches;
      bookEl.innerHTML = '';
      const w = bookEl.clientWidth, h = bookEl.clientHeight;
      lastSize = w + 'x' + h + (isMobile ? 'm' : 'd');

      PAGES = paginate(getCatalogData(), isMobile ? w : w / 2, h);
      const per = isMobile ? 1 : 2;
      totalLeaves = Math.ceil(PAGES.length / per);
      maxIdx = isMobile ? totalLeaves - 1 : totalLeaves;
      currentSpread = Math.max(0, Math.min(currentSpread, maxIdx));

      for (let k = 0; k < totalLeaves; k++) {
        const fi = k * per;
        const leaf = document.createElement('div');
        leaf.className = 'flip-leaf';
        leaf.id = `leaf-${k}`;
        leaf.innerHTML = `
          <div class="leaf-face front">${faceHTML(PAGES[fi], fi)}<div class="inner-gutter-right"></div></div>
          <div class="leaf-face back">${isMobile ? '' : faceHTML(PAGES[fi + 1] || null, fi + 1)}<div class="inner-gutter-left"></div></div>`;
        bookEl.appendChild(leaf);
      }
      renderNavigationTrack();
      updateSpreadState();
    }

    function updateSpreadState() {
      for (let i = 0; i < totalLeaves; i++) {
        const leaf = document.getElementById(`leaf-${i}`);
        if (!leaf) continue;
        if (i < currentSpread) { leaf.classList.add('flipped'); leaf.style.zIndex = 10 + i; }
        else { leaf.classList.remove('flipped'); leaf.style.zIndex = (totalLeaves - i) * 4; }
      }
      document.getElementById('btnPrev').disabled = currentSpread === 0;
      document.getElementById('btnNext').disabled = currentSpread >= maxIdx;
      document.getElementById('pageIndicator').textContent = `${currentSpread + 1} / ${maxIdx + 1}`;
      document.getElementById('idxLabel').textContent = isMobile ? 'Page' : 'Spread';
      updateNavigationDots();
    }

    function flipNext() {
      if (currentSpread < maxIdx) { currentSpread++; playPageTurnAudio(); updateSpreadState(); }
    }
    function flipPrev() {
      if (currentSpread > 0) { currentSpread--; playPageTurnAudio(); updateSpreadState(); }
    }
    function jumpToSpread(i) {
      if (i >= 0 && i <= maxIdx && i !== currentSpread) { currentSpread = i; playPageTurnAudio(); updateSpreadState(); }
    }

    function renderNavigationTrack() {
      const track = document.getElementById('dotTrack');
      track.innerHTML = '';
      for (let i = 0; i <= maxIdx; i++) {
        const dot = document.createElement('button');
        dot.title = `Go to ${i + 1}`;
        dot.onclick = () => jumpToSpread(i);
        track.appendChild(dot);
      }
      updateNavigationDots();
    }
    function updateNavigationDots() {
      const dots = document.getElementById('dotTrack').children;
      for (let i = 0; i < dots.length; i++) {
        dots[i].className = `h-2 rounded-full transition-all ${i === currentSpread ? 'bg-[#CBB892] w-5' : 'bg-white/20 hover:bg-white/40 w-2'}`;
      }
    }

    /* ---------- Wheel, touch, keyboard, click ---------- */
    let wheelCooldown = false;
    const modalOpen = () => !document.getElementById('quickBookModal').classList.contains('hidden');

    window.addEventListener('wheel', (e) => {
      if (wheelCooldown || modalOpen()) return;
      const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      if (delta > 35) { flipNext(); wheelCooldown = true; setTimeout(() => { wheelCooldown = false; }, 420); }
      else if (delta < -35) { flipPrev(); wheelCooldown = true; setTimeout(() => { wheelCooldown = false; }, 420); }
    }, { passive: true });

    let touchStartX = 0, touchStartY = 0;
    window.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });
    window.addEventListener('touchend', (e) => {
      if (modalOpen()) return;
      const diffX = touchStartX - e.changedTouches[0].screenX;
      const diffY = touchStartY - e.changedTouches[0].screenY;
      if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 40) {
        if (diffX > 0) flipNext(); else flipPrev();
      }
    }, { passive: true });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { closeBookModal(); return; }
      if (modalOpen()) return;
      if (e.key === 'ArrowRight' || e.key === 'PageDown') flipNext();
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') flipPrev();
    });

    document.getElementById('book').addEventListener('click', (e) => {
      const row = e.target.closest('[data-name]');
      if (row) { openBookModal(row.dataset.name, row.dataset.price); return; }
      if (isMobile) return;
      const leaf = e.target.closest('.flip-leaf');
      if (!leaf) return;
      const k = +leaf.id.replace('leaf-', '');
      if (k === currentSpread) flipNext();
      else if (k === currentSpread - 1) flipPrev();
    });

    let rzT;
    window.addEventListener('resize', () => {
      clearTimeout(rzT);
      rzT = setTimeout(() => {
        const b = document.getElementById('book');
        const key = b.clientWidth + 'x' + b.clientHeight + (mqMobile.matches ? 'm' : 'd');
        if (key === lastSize) return;
        const rightPage = isMobile ? currentSpread : currentSpread * 2;
        currentSpread = mqMobile.matches ? rightPage : Math.floor(rightPage / 2);
        buildFlipbook();
      }, 250);
    });

      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('gender') === 'men') {
        document.getElementById('btnMen').click();
      } else {
        buildFlipbook();
      }
    }
    document.addEventListener('DOMContentLoaded', () => {
      const ready = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
      ready.then(() => requestAnimationFrame(() => requestAnimationFrame(init)));
    });

  </script>
</body>
